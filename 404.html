<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="404 - Page not found" />
    <title>404 | Page Not Found</title>
    <link rel="stylesheet" href="dist/output.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen w-full max-w-full overflow-x-hidden bg-gradient-to-br from-primary-dark via-primary to-primary-light text-white font-sans">
    <main class="min-h-screen w-full max-w-full flex items-center justify-center px-4 py-10 sm:px-6">
        <section class="w-full max-w-full sm:max-w-2xl rounded-3xl border border-white/10 bg-white/5 backdrop-blur-xl p-6 sm:p-10 text-center shadow-2xl">
            <p class="text-accent-gold text-sm sm:text-base tracking-[0.12em] uppercase">Error</p>
            <h1 class="font-display mt-3 text-6xl sm:text-7xl md:text-8xl leading-none text-accent-gold">404</h1>
            <h2 class="mt-4 text-2xl sm:text-3xl font-semibold">Page Not Found</h2>
            <p class="mt-4 text-white/75 text-sm sm:text-base leading-relaxed">
                The page you’re looking for doesn’t exist or may have been moved.
            </p>

            <div class="mt-8 flex flex-col sm:flex-row items-center justify-center gap-3 sm:gap-4">
                <a href="index.html" class="w-full sm:w-auto inline-flex items-center justify-center rounded-full bg-gradient-to-r from-accent-gold to-accent-gold-light px-6 py-3 text-primary-dark font-semibold transition-transform duration-300 hover:scale-105">
                    Back To Home
                </a>
                <button type="button" onclick="history.back()" class="w-full sm:w-auto inline-flex items-center justify-center rounded-full border border-white/20 bg-white/5 px-6 py-3 font-semibold transition-all duration-300 hover:bg-white/10 hover:scale-105">
                    Go Back
                </button>
            </div>
        </section>
    </main>
</body>
</html>
