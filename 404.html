<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Page Not Found - Muhammad Auf Portfolio">
    <title>404 | Page Not Found</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Playfair+Display:wght@700&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            dark: '#0a1128',
                            DEFAULT: '#001f54',
                            light: '#034078',
                        },
                        accent: {
                            blue: '#1282a2',
                            gold: '#ffc857',
                            'gold-light': '#ffd97d',
                            'gold-dark': '#d4a017',
                        }
                    },
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                        arabic: ['Cairo', 'sans-serif'],
                        display: ['Playfair Display', 'serif'],
                    },
                }
            }
        }
    </script>
    <style>
        html { scroll-behavior: smooth; }

        body {
            font-family: 'Poppins', sans-serif;
            background: #0a1128;
            color: #ffffff;
            overflow: hidden;
            min-height: 100vh;
        }

        .text-gradient {
            background: linear-gradient(135deg, #ffc857 0%, #ffd97d 50%, #1282a2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Floating orbs */
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(50px, -30px) scale(1.1); }
            50% { transform: translate(-30px, 50px) scale(0.9); }
            75% { transform: translate(40px, 20px) scale(1.05); }
        }

        @keyframes rotate-float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(20px, -20px) rotate(180deg); }
            100% { transform: translate(0, 0) rotate(360deg); }
        }

        @keyframes pulse-float {
            0%, 100% { transform: scale(1) translateY(0); opacity: 0.6; }
            50% { transform: scale(1.1) translateY(-20px); opacity: 0.9; }
        }

        .animate-float { animation: float 20s ease-in-out infinite; }
        .animate-float-delayed { animation: float 25s ease-in-out infinite; animation-delay: -5s; }
        .animate-float-slow { animation: float 30s ease-in-out infinite; animation-delay: -10s; }

        /* Glitch effect for 404 */
        @keyframes glitch-skew {
            0% { transform: skew(0deg); }
            2% { transform: skew(2deg); }
            4% { transform: skew(0deg); }
            48% { transform: skew(0deg); }
            50% { transform: skew(-1deg); }
            52% { transform: skew(0deg); }
            100% { transform: skew(0deg); }
        }

        @keyframes glitch-clip-1 {
            0% { clip-path: inset(20% 0 60% 0); }
            10% { clip-path: inset(50% 0 10% 0); }
            20% { clip-path: inset(10% 0 70% 0); }
            30% { clip-path: inset(80% 0 5% 0); }
            40% { clip-path: inset(30% 0 40% 0); }
            50% { clip-path: inset(60% 0 10% 0); }
            60% { clip-path: inset(15% 0 65% 0); }
            70% { clip-path: inset(45% 0 25% 0); }
            80% { clip-path: inset(70% 0 10% 0); }
            90% { clip-path: inset(5% 0 80% 0); }
            100% { clip-path: inset(20% 0 60% 0); }
        }

        @keyframes glitch-clip-2 {
            0% { clip-path: inset(60% 0 10% 0); }
            10% { clip-path: inset(10% 0 70% 0); }
            20% { clip-path: inset(80% 0 5% 0); }
            30% { clip-path: inset(20% 0 60% 0); }
            40% { clip-path: inset(50% 0 10% 0); }
            50% { clip-path: inset(30% 0 40% 0); }
            60% { clip-path: inset(70% 0 10% 0); }
            70% { clip-path: inset(15% 0 65% 0); }
            80% { clip-path: inset(45% 0 25% 0); }
            90% { clip-path: inset(5% 0 75% 0); }
            100% { clip-path: inset(60% 0 10% 0); }
        }

        .glitch-wrapper {
            position: relative;
            display: inline-block;
            animation: glitch-skew 6s infinite linear alternate-reverse;
        }

        .glitch-text::before,
        .glitch-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a1128;
        }

        .glitch-text::before {
            left: 3px;
            text-shadow: -3px 0 #1282a2;
            animation: glitch-clip-1 4s infinite linear alternate-reverse;
        }

        .glitch-text::after {
            left: -3px;
            text-shadow: 3px 0 #ffc857;
            animation: glitch-clip-2 4s infinite linear alternate-reverse;
            animation-delay: -1s;
        }

        /* Scan lines */
        .scan-lines {
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(255, 255, 255, 0.015) 2px,
                rgba(255, 255, 255, 0.015) 4px
            );
            pointer-events: none;
            z-index: 5;
        }

        /* Floating code fragments */
        @keyframes drift {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.4; }
            90% { opacity: 0.4; }
            100% { transform: translateY(-100vh) rotate(15deg); opacity: 0; }
        }

        .code-fragment {
            position: absolute;
            font-family: 'Courier New', monospace;
            color: rgba(18, 130, 162, 0.25);
            font-size: 0.75rem;
            white-space: nowrap;
            animation: drift linear infinite;
            pointer-events: none;
        }

        /* Mouse parallax on orbs */
        .parallax-orb {
            transition: transform 0.3s ease-out;
        }

        /* Button hover glow */
        .btn-glow {
            position: relative;
            overflow: hidden;
        }

        .btn-glow::before {
            content: '';
            position: absolute;
            inset: -2px;
            background: linear-gradient(135deg, #ffc857, #1282a2, #ffc857);
            border-radius: inherit;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s ease;
            filter: blur(8px);
        }

        .btn-glow:hover::before {
            opacity: 0.6;
        }

        /* Fade in animation */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade-in-up {
            animation: fadeInUp 0.8s ease-out forwards;
        }

        .animate-delay-100 { animation-delay: 0.1s; opacity: 0; }
        .animate-delay-200 { animation-delay: 0.2s; opacity: 0; }
        .animate-delay-300 { animation-delay: 0.3s; opacity: 0; }
        .animate-delay-400 { animation-delay: 0.4s; opacity: 0; }
        .animate-delay-500 { animation-delay: 0.5s; opacity: 0; }

        /* Subtle noise texture */
        .noise-overlay {
            position: fixed;
            inset: 0;
            opacity: 0.03;
            z-index: 4;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-size: 256px 256px;
        }
    </style>
</head>
<body class="bg-primary-dark text-white font-sans">

    <!-- Animated Background -->
    <div class="fixed inset-0 -z-10 bg-gradient-to-br from-primary-dark via-primary to-primary-light overflow-hidden">
        <div class="parallax-orb absolute -top-48 -left-48 w-[500px] h-[500px] bg-accent-blue/30 rounded-full blur-[120px] animate-float" data-speed="0.02"></div>
        <div class="parallax-orb absolute -bottom-36 -right-36 w-96 h-96 bg-accent-gold/30 rounded-full blur-[120px] animate-float-delayed" data-speed="0.03"></div>
        <div class="parallax-orb absolute top-1/3 left-1/2 -translate-x-1/2 -translate-y-1/2 w-80 h-80 bg-primary-light/30 rounded-full blur-[120px] animate-float-slow" data-speed="0.015"></div>
    </div>

    <!-- Floating Shapes -->
    <div class="fixed inset-0 pointer-events-none z-0">
        <div class="absolute top-[10%] left-[10%] w-24 h-24 border-2 border-white/5 rounded-full" style="animation: rotate-float 30s ease-in-out infinite;"></div>
        <div class="absolute top-[70%] right-[15%] w-20 h-20 border-2 border-white/5" style="animation: rotate-float 20s ease-in-out infinite reverse;"></div>
        <div class="absolute top-[30%] right-[25%] w-16 h-16 border-2 border-white/5 rounded-full" style="animation: pulse-float 15s ease-in-out infinite;"></div>
        <div class="absolute bottom-[15%] left-[20%] w-28 h-28 border-2 border-white/5" style="animation: rotate-float 25s ease-in-out infinite;"></div>
    </div>

    <!-- Scan Lines -->
    <div class="scan-lines"></div>

    <!-- Noise overlay -->
    <div class="noise-overlay"></div>

    <!-- Code Fragments (populated by JS) -->
    <div id="codeFragments" class="fixed inset-0 pointer-events-none z-0 overflow-hidden"></div>

    <!-- Main Content -->
    <main class="relative z-10 min-h-screen flex flex-col items-center justify-center px-6">
        <div class="text-center max-w-2xl mx-auto">

            <!-- 404 Number with Glitch -->
            <div class="glitch-wrapper animate-fade-in-up">
                <h1 class="glitch-text font-display text-[10rem] md:text-[14rem] font-bold leading-none text-gradient select-none"
                    data-text="404"
                    aria-label="404 Error">
                    404
                </h1>
            </div>

            <!-- Divider Line -->
            <div class="animate-fade-in-up animate-delay-100">
                <div class="w-24 h-px mx-auto bg-gradient-to-r from-transparent via-accent-gold to-transparent mb-8"></div>
            </div>

            <!-- Message -->
            <h2 class="font-display text-2xl md:text-3xl font-bold mb-4 animate-fade-in-up animate-delay-200">
                <span class="text-white" data-en="Lost in the void" data-ar="ضائع في الفراغ">Lost in the void</span>
            </h2>

            <p class="text-white/60 text-lg md:text-xl leading-relaxed mb-10 animate-fade-in-up animate-delay-300"
               data-en="The page you're looking for has drifted into the digital abyss. Let's get you back on course."
               data-ar="الصفحة التي تبحث عنها انجرفت إلى الهاوية الرقمية. دعنا نعيدك إلى المسار الصحيح.">
                The page you're looking for has drifted into the digital abyss. Let's get you back on course.
            </p>

            <!-- Buttons -->
            <div class="flex flex-col sm:flex-row gap-4 justify-center items-center animate-fade-in-up animate-delay-400">
                <a href="index.html"
                   class="btn-glow px-10 py-4 rounded-full bg-gradient-to-r from-accent-gold to-accent-gold-light text-primary-dark font-semibold hover:scale-105 transition-transform duration-300 shadow-lg hover:shadow-accent-gold/40 inline-flex items-center gap-3"
                   data-en="Back to Home" data-ar="العودة للرئيسية">
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                    <span data-en="Back to Home" data-ar="العودة للرئيسية">Back to Home</span>
                </a>

                <button onclick="history.back()"
                        class="px-10 py-4 rounded-full bg-white/5 backdrop-blur-md border border-white/10 text-white font-semibold hover:bg-white/10 hover:scale-105 transition-all duration-300 inline-flex items-center gap-3"
                        data-en="Go Back" data-ar="ارجع">
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    <span data-en="Go Back" data-ar="ارجع">Go Back</span>
                </button>
            </div>

            <!-- Breadcrumb path hint -->
            <div class="mt-12 animate-fade-in-up animate-delay-500">
                <p class="glass-card inline-flex items-center gap-2 px-5 py-2.5 rounded-full text-sm text-white/40">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                    <span id="currentPath"></span>
                </p>
            </div>
        </div>
    </main>

    <script>
        // Show current URL path
        const currentPath = document.getElementById('currentPath');
        if (currentPath) {
            currentPath.textContent = window.location.pathname;
        }

        // Floating code fragments
        const fragments = [
            '{ status: 404 }',
            'res.notFound()',
            'throw new Error()',
            '// page missing',
            'return null;',
            'catch (err) {}',
            '404 Not Found',
            'undefined',
            'route.missing',
            'path === ???',
            'fetch().catch()',
            '/* lost */',
        ];

        const container = document.getElementById('codeFragments');

        function createFragment() {
            const el = document.createElement('span');
            el.className = 'code-fragment';
            el.textContent = fragments[Math.floor(Math.random() * fragments.length)];
            el.style.left = Math.random() * 100 + '%';
            el.style.bottom = '-40px';
            el.style.animationDuration = (15 + Math.random() * 25) + 's';
            el.style.animationDelay = Math.random() * 5 + 's';
            el.style.fontSize = (0.65 + Math.random() * 0.5) + 'rem';
            container.appendChild(el);

            setTimeout(() => el.remove(), 45000);
        }

        // Initial batch
        for (let i = 0; i < 12; i++) {
            setTimeout(createFragment, i * 600);
        }

        // Continuous spawning
        setInterval(createFragment, 3000);

        // Mouse parallax on orbs
        const orbs = document.querySelectorAll('.parallax-orb');
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 2;
            const y = (e.clientY / window.innerHeight - 0.5) * 2;

            orbs.forEach(orb => {
                const speed = parseFloat(orb.dataset.speed) || 0.02;
                const moveX = x * speed * 100;
                const moveY = y * speed * 100;
                orb.style.transform = `translate(${moveX}px, ${moveY}px)`;
            });
        });
    </script>
</body>
</html>
